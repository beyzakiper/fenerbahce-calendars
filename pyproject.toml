[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fbcal"
version = "0.1.0"
description = "Auto-updating iCalendar feeds for Fenerbahçe first teams, built for Apple Calendar (unofficial fan project)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "openpyxl>=3.1,<4",
    "icalendar>=6,<7",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fbcal = "fbcal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
