name: Update calendars

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC), at :17 to avoid the top-of-hour rush
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: update-calendars
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # commit data/ changes
      issues: write     # report source problems
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Validate config
        run: python -m fbcal check

      - name: Build feeds
        run: python -m fbcal build --out public

      - name: Summary
        if: always()
        run: test -f build/report.md && cat build/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit changed data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update match data"
          git pull --rebase "https://github.com/${GITHUB_REPOSITORY}.git" main
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Report source problems as an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL="source-problem"
          gh label create "$LABEL" --color FFD100 --description "A data source failed" --force >/dev/null 2>&1 || true
          open=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -f build/problems.md ]; then
            { echo "One or more data sources failed or returned suspiciously few matches. The last good data is kept; the feeds did not shrink."; echo; cat build/problems.md; echo; echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; } > body.md
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file body.md
            else
              gh issue create --title "Data source problem" --label "$LABEL" --body-file body.md
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "All sources are healthy again."
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    # On free accounts GitHub Pages only works for public repos, so deploying is skipped while private
    # (the feeds can still be downloaded from each run's "github-pages" artifact).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
