# Competitions: displayed name (no sponsor) and optional round dates.
# Keys (super-lig, ...) are part of event UIDs: DO NOT rename them. "name" can change freely.
#
# round_dates: official day of a round, when it was announced somewhere our sources don't cover
#              (published as all-day "saat belli değil" until a source gives the time).
# Matches without an official date are never published; nothing is estimated.

competitions:
  # Football
  super-lig:                     { name: "Süper Lig" }
  turkiye-kupasi:                { name: "Türkiye Kupası" }
  super-kupa:                    { name: "Süper Kupa" }
  uefa-sampiyonlar-ligi:         { name: "UEFA Şampiyonlar Ligi" }
  uefa-avrupa-ligi:              { name: "UEFA Avrupa Ligi" }
  uefa-konferans-ligi:           { name: "UEFA Konferans Ligi" }
  uefa-super-kupa:               { name: "UEFA Süper Kupa" }
  hazirlik:                      { name: "Hazırlık Maçı", friendly: true }
  kadin-futbol-super-ligi:       { name: "Kadın Futbol Süper Ligi" }
  uefa-kadinlar-sampiyonlar-ligi: { name: "UEFA Kadınlar Şampiyonlar Ligi" }
  uefa-kadinlar-avrupa-kupasi:   { name: "UEFA Kadınlar Avrupa Kupası" }

  # Basketball
  basketbol-super-ligi:          { name: "Basketbol Süper Ligi" }
  cumhurbaskanligi-kupasi-erkek: { name: "Cumhurbaşkanlığı Kupası" }
  turkiye-kupasi-basketbol-erkek: { name: "Türkiye Kupası" }
  euroleague:                    { name: "EuroLeague" }
  kadinlar-basketbol-super-ligi: { name: "Kadınlar Basketbol Süper Ligi" }
  cumhurbaskanligi-kupasi-kadin: { name: "Cumhurbaşkanlığı Kupası" }
  turkiye-kupasi-basketbol-kadin: { name: "Türkiye Kupası" }
  euroleague-women:              { name: "EuroLeague Women" }

  # Volleyball
  sultanlar-ligi:
    name: "Sultanlar Ligi"
